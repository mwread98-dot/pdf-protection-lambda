AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Serverless PDF protection pipeline using Amazon S3,
  AWS Lambda, qpdf and AWS Secrets Manager.

Parameters:
  FunctionMemorySize:
    Type: Number
    Default: 2048
    MinValue: 1024
    MaxValue: 10240
    Description: Memory allocated to the PDF processing Lambda function.

  FunctionTimeout:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 900
    Description: Lambda timeout in seconds.

  EphemeralStorageSize:
    Type: Number
    Default: 4096
    MinValue: 512
    MaxValue: 10240
    Description: Temporary Lambda storage in MB.

Resources:
  InputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pdf-protection-input-${AWS::AccountId}-${AWS::Region}"

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pdf-protection-output-${AWS::AccountId}-${AWS::Region}"

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  PdfOwnerPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/pdf-owner-password"
      Description: Owner password used to protect generated PDF documents

      GenerateSecretString:
        SecretStringTemplate: '{"purpose":"pdf-owner-password"}'
        GenerateStringKey: owner_password
        PasswordLength: 40
        ExcludePunctuation: true

      Tags:
        - Key: Application
          Value: PdfProtection

        - Key: ManagedBy
          Value: CloudFormation

  PdfProtectionFunction:
    Type: AWS::Serverless::Function

    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.13-qpdf-v1

    Properties:
      PackageType: Image

      Architectures:
        - x86_64

      MemorySize: !Ref FunctionMemorySize
      Timeout: !Ref FunctionTimeout

      EphemeralStorage:
        Size: !Ref EphemeralStorageSize

      Environment:
        Variables:
          OUTPUT_BUCKET: !Sub "pdf-protection-output-${AWS::AccountId}-${AWS::Region}"
          OWNER_PASSWORD_SECRET_ARN: !Ref PdfOwnerPasswordSecret
          LOG_LEVEL: INFO

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadInputBucketObjects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::pdf-protection-input-${AWS::AccountId}-${AWS::Region}/*"

            - Sid: WriteOutputBucketObjects
              Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::pdf-protection-output-${AWS::AccountId}-${AWS::Region}/*"

            - Sid: ReadPdfOwnerPassword
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PdfOwnerPasswordSecret

      Events:
        PdfUploaded:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events:
              - s3:ObjectCreated:*

  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PDF protection Lambda function has reported an error
      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref PdfProtectionFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PDF protection Lambda function has been throttled
      Namespace: AWS/Lambda
      MetricName: Throttles

      Dimensions:
        - Name: FunctionName
          Value: !Ref PdfProtectionFunction

      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  InputBucketName:
    Description: Upload unprotected PDF documents to this bucket
    Value: !Ref InputBucket

  InputBucketArn:
    Description: ARN of the input S3 bucket
    Value: !GetAtt InputBucket.Arn

  OutputBucketName:
    Description: Protected PDF documents are written to this bucket
    Value: !Ref OutputBucket

  OutputBucketArn:
    Description: ARN of the output S3 bucket
    Value: !GetAtt OutputBucket.Arn

  LambdaFunctionName:
    Description: PDF processing Lambda function
    Value: !Ref PdfProtectionFunction

  LambdaFunctionArn:
    Description: ARN of the PDF processing Lambda function
    Value: !GetAtt PdfProtectionFunction.Arn

  OwnerPasswordSecretArn:
    Description: ARN of the generated PDF owner-password secret
    Value: !Ref PdfOwnerPasswordSecret

  ErrorAlarmName:
    Description: CloudWatch alarm that detects Lambda function errors
    Value: !Ref FunctionErrorAlarm

  ThrottleAlarmName:
    Description: CloudWatch alarm that detects Lambda throttling
    Value: !Ref FunctionThrottleAlarm
