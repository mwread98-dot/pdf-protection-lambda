name: Build and deploy PDF protection service

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"
      - "template.yaml"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: pdf-protection-production
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    name: Validate, build and deploy
    runs-on: ubuntu-latest

    environment: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          JWT="$(
            printf '%s' "$RESPONSE" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"

          export JWT

          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["JWT"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          safe_claims = {
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "environment": claims.get("environment"),
              "ref": claims.get("ref"),
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-pdf-protection-deploy
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-pdf-protection-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Display AWS identity
        run: aws sts get-caller-identity

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display tool versions
        run: |
          aws --version
          sam --version
          docker --version

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build Lambda container
        run: sam build

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FunctionMemorySize=2048 \
              FunctionTimeout=300 \
              EphemeralStorageSize=4096

      - name: Display deployment outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
