name: Build and deploy PDF protection service

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"
      - "template.yaml"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: pdf-protection-production
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    name: Validate, build and deploy
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    environment: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      SAM_CLI_TELEMETRY: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_ROLE="arn:aws:iam::975050060060:role/GitHubActions-PdfProtection-Deploy"

          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN repository variable is not defined."
            exit 1
          fi

          if [ "${{ vars.AWS_ROLE_ARN }}" != "$EXPECTED_ROLE" ]; then
            echo "AWS_ROLE_ARN contains an unexpected value."
            echo "Expected: $EXPECTED_ROLE"
            exit 1
          fi

          if [ -z "${AWS_REGION}" ]; then
            echo "AWS_REGION repository variable is not defined."
            exit 1
          fi

          if [ -z "${AWS_STACK_NAME}" ]; then
            echo "AWS_STACK_NAME repository variable is not defined."
            exit 1
          fi

          echo "AWS role: $EXPECTED_ROLE"
          echo "AWS Region: $AWS_REGION"
          echo "CloudFormation stack: $AWS_STACK_NAME"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-pdf-protection-deploy
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Verify assumed AWS identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          CALLER_ARN="$(
            aws sts get-caller-identity \
              --query Arn \
              --output text
          )"

          if [ "$ACCOUNT_ID" != "975050060060" ]; then
            echo "The workflow authenticated to the wrong AWS account."
            echo "Expected account: 975050060060"
            echo "Actual account: $ACCOUNT_ID"
            exit 1
          fi

          echo "AWS account verified: $ACCOUNT_ID"
          echo "Caller ARN: $CALLER_ARN"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display tool versions
        shell: bash
        run: |
          set -euo pipefail

          aws --version
          sam --version
          docker --version

      - name: Validate SAM template
        shell: bash
        run: |
          set -euo pipefail

          sam validate \
            --template-file template.yaml \
            --lint

      - name: Build Lambda container
        shell: bash
        run: |
          set -euo pipefail

          sam build \
            --template-file template.yaml

      - name: Deploy SAM application
        shell: bash
        run: |
          set -euo pipefail

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              FunctionMemorySize=2048 \
              FunctionTimeout=300 \
              EphemeralStorageSize=4096

      - name: Display deployment outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
